[package]
name = "ingest"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Turns the EDSM systems dump into galaxy.sqlite, octree tiles and density maps"

[features]
# The command-line front end; the app uses the library without it.
default = ["cli"]
cli = ["dep:clap"]

[[bin]]
name = "ingest"
required-features = ["cli"]

[dependencies]
galaxy-core = { path = "../galaxy-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite = { workspace = true, features = ["hooks"] }
clap = { version = "4", features = ["derive"], optional = true }
csv = "1"
flate2 = "1"
png = "0.17"
reqwest = { version = "0.12", features = ["blocking"] }
rustc-hash = "2"
# HashTable: the density map keeps one u64 per boxel, no separate key.
hashbrown = { version = "0.17", default-features = false }
fs4 = { version = "1", default-features = false }

[dev-dependencies]
tempfile = "3"
