# Tests every push and pull request. Builds the Windows installer for pushes
# to main and for version tags (v0.3.0 and so on), or on request from the
# Actions tab (Run workflow) for any branch.
#
# A version tag also gets a draft GitHub release: titled for the version,
# with docs/releases/<version>.md as its notes and the installer attached,
# to look over and publish by hand. Run workflow with "release" set to a tag
# drafts one for a tag that's already been pushed; it tests and builds the
# tag's code, whatever branch it's run from.
#
# Everything but the drafting runs on Windows: the app is Windows-only
# (journal paths, WebView2). The repository is public, so hosted runners
# cost nothing. scripts/ci.cmd runs the same steps on a local machine.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      installer:
        description: Build the installer too
        type: boolean
        default: true
      release:
        description: Draft the GitHub release for this version tag (e.g. v0.3.0)
        type: string
        default: ""

# Read-only token, except in the release job, which drafts the release.
permissions:
  contents: read

# A newer push to a branch supersedes its run in progress, except on main,
# where every commit gets its own installer, for tags, which are releases,
# and for releases drafted from the Actions tab. Those each get a group of
# their own: a shared group, even without cancel-in-progress, would still
# cancel a waiting run when a newer one queued behind it.
concurrency:
  group: ci-${{ github.ref }}-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release != '')) && github.run_id || 'latest' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts only bloat the cache on CI.
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # A release asked for from the Actions tab is tested at its tag.
          ref: ${{ inputs.release }}

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      # `build` is `tsc && vite build`, so this also typechecks. The Rust
      # build below expects app/dist to exist.
      - name: Typecheck and build the frontend
        working-directory: app
        run: pnpm build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust tests
        run: cargo test --workspace --locked

  installer:
    name: Installer
    needs: test
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
      || (github.event_name == 'workflow_dispatch' && (inputs.installer || inputs.release != ''))
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # A release asked for from the Actions tab is built from its tag.
          ref: ${{ inputs.release }}

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the installer
        working-directory: app
        run: pnpm tauri build

      - uses: actions/upload-artifact@v7
        with:
          # Named for the release's tag when it's for one, else the commit.
          name: StellarCartography-installer-${{ inputs.release || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || github.sha }}
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft release
    needs: installer
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.release || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release }}
      - uses: actions/download-artifact@v7
        with:
          name: StellarCartography-installer-${{ inputs.release || github.ref_name }}
          path: installer
      - name: Draft the release
        run: |
          version="${TAG#v}"
          notes="docs/releases/${version}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::There are no release notes at $notes. Add them, then run the workflow with release set to $TAG."
            exit 1
          fi
          # The release's own title stands in for the notes' first heading.
          sed '1{/^# /d}' "$notes" > notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Drafted (or published) already: only the installer is replaced.
            gh release upload "$TAG" installer/*-setup.exe --clobber
          else
            gh release create "$TAG" installer/*-setup.exe --draft --verify-tag \
              --title "Stellar Cartography $version" --notes-file notes.md
          fi
